services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: website_doctor
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d website_doctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["ai"]

volumes:
  postgres_data:
  ollama_data:
