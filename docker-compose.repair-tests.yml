services:
  repair-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repair_authorization_test
      POSTGRES_USER: repair_test
      POSTGRES_PASSWORD: repair_test_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repair_test -d repair_authorization_test"]
      interval: 2s
      timeout: 3s
      retries: 30
